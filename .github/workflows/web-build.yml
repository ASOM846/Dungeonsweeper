name: Build Web and Deploy to GitHub Pages

# Kiedy ma się uruchamiać ten skrypt?
on:
  push:
    branches: [ "main", "master", "androidTest", "eq" ] # Zmieniłem, żeby łapało Twojego obecnego brancha
  workflow_dispatch: # Pozwala odpalić build ręcznie z poziomu GitHuba

# Uprawnienia potrzebne do publikacji na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie kodu z repozytorium
        uses: actions/checkout@v4
        with:
          submodules: recursive # Pobiera raylib i raymob, jeśli są dodane jako submoduły

      - name: Instalacja Emscripten (Kompilator Web/WASM)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache: true

      - name: Budowanie gry (Uruchomienie Twojego skryptu)
        run: |
          chmod +x buildWeb.sh
          ./buildWeb.sh

      - name: Przygotowanie plików do publikacji
        run: |
          # Tworzymy folder 'dist', który wyślemy na serwer
          mkdir -p dist
          # Przenosimy tam wygenerowane pliki
          mv index.html index.js index.wasm index.data dist/
          
          # UWAGA: Jeśli w przeglądarce brakuje tekstur, 
          # odkomentuj poniższą linijkę, aby skopiować też folder assets:
          # cp -r assets dist/

      - name: Upload plików jako artefakt Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
